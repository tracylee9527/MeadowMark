<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meadowmark</title>
</head>
<body style="margin:0">
<title>Meadowmark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700;800&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --ink:#131c27; --ink2:#18232f; --panel:#1c2733; --panel2:#233140; --line:#34475b;
  --text:#eef0e3; --muted:#9fb0bd; --gold:#f0c35a; --good:#8fd18a; --bad:#e2735f;
  --meadow:#9bc46b; --forest:#3f7d4e; --wheat:#e3c15a; --water:#4f9bd1; --village:#c9795a;
  --display:"Alegreya SC", Georgia, "Times New Roman", serif;
  --body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
}
html,body{height:100%;}
[hidden]{display:none !important;}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent;}
button{font:inherit;color:inherit;cursor:pointer;}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
#board{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block;}

.hud-top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;}
.hud-top > *{pointer-events:auto;}
.scorecard{background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:10px;padding:8px 14px 10px;backdrop-filter:blur(6px);}
.mode{font-family:var(--display);font-size:13px;letter-spacing:.06em;color:var(--gold);}
.nums{display:flex;gap:20px;margin-top:2px;}
.nums div{display:flex;flex-direction:column;}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);}
.nums b{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;}
#left.low{color:var(--bad);}
.top-actions{display:flex;gap:6px;}
.iconbtn{min-width:40px;height:40px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(6px);font-size:16px;}
.iconbtn:hover{background:var(--panel2);}

.quests{position:fixed;right:16px;top:calc(env(safe-area-inset-top,0px) + 66px);width:230px;display:flex;flex-direction:column;gap:6px;pointer-events:none;}
.quests h3{margin:0;font-family:var(--display);font-size:13px;letter-spacing:.08em;color:var(--muted);font-weight:500;}
.quest{pointer-events:auto;text-align:left;background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--line);border-radius:9px;padding:8px 10px;display:grid;grid-template-columns:14px 1fr auto;gap:2px 8px;align-items:center;}
.quest .sw{width:12px;height:12px;border-radius:3px;}
.quest .qt{font-weight:700;font-size:14px;}
.quest .qn{font-variant-numeric:tabular-nums;font-weight:700;}
.quest .qs{grid-column:2 / 4;font-size:12px;color:var(--muted);}
.quest .bar{grid-column:2 / 4;height:4px;border-radius:2px;background:var(--line);overflow:hidden;}
.quest .bar i{display:block;height:100%;}
.q-empty{font-size:12px;color:var(--muted);pointer-events:none;}

.tray{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;align-items:center;gap:14px;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:14px;padding:10px 14px;backdrop-filter:blur(8px);max-width:calc(100% - 32px);}
.nexts{display:flex;flex-direction:column;gap:4px;align-items:center;}
.nexts .lbl{font-size:10px;}
.cur{display:flex;align-items:center;gap:6px;}
.rot{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);font-size:18px;}
.rot:hover{border-color:var(--gold);}
.info{display:flex;flex-direction:column;gap:6px;min-width:0;max-width:220px;}
#questHint{font-size:12px;color:var(--gold);line-height:1.3;}
#hint{font-size:12px;color:var(--muted);line-height:1.3;}
#placeBtn{height:38px;border-radius:9px;border:0;background:var(--gold);color:#2a2008;font-weight:700;padding:0 16px;}
#placeBtn:disabled{opacity:.35;cursor:default;}

#toasts{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 90px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:30;}
.toast{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-weight:700;font-size:14px;animation:toast 1.9s ease forwards;white-space:nowrap;}
.toast.gold{border-color:var(--gold);color:var(--gold);}
.toast.good{border-color:var(--good);color:var(--good);}
.toast.bad{border-color:var(--bad);color:var(--bad);}
@keyframes toast{0%{opacity:0;transform:translateY(8px)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}

.overlay{position:fixed;inset:0;background:rgba(10,15,22,.72);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 24px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);z-index:10;}
.sheet{width:100%;max-width:520px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px 24px;display:flex;flex-direction:column;gap:16px;margin-block:auto;}
.logo{font-family:var(--display);font-weight:800;font-size:44px;margin:0;line-height:1;letter-spacing:.01em;}
.logo span{color:var(--gold);}
.tag{margin:0;color:var(--muted);line-height:1.45;max-width:44ch;}
.lvl{display:flex;flex-direction:column;gap:6px;}
.lvl-row{display:flex;justify-content:space-between;font-size:13px;}
.lvl-row b{font-family:var(--display);font-size:16px;color:var(--gold);}
.xpbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;}
.xpbar i{display:block;height:100%;background:var(--gold);}
.modes{display:flex;flex-direction:column;gap:8px;}
.modebtn{display:grid;grid-template-columns:1fr auto;gap:2px 12px;text-align:left;padding:14px 16px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);}
.modebtn:hover{border-color:var(--gold);}
.modebtn .mt{font-family:var(--display);font-size:20px;font-weight:700;}
.modebtn .ms{grid-column:1;font-size:13px;color:var(--muted);}
.modebtn .mr{grid-row:1 / 3;grid-column:2;align-self:center;text-align:right;font-size:13px;color:var(--gold);font-variant-numeric:tabular-nums;}
.seedrow{display:flex;gap:8px;}
.seedrow input{flex:1;min-width:0;height:40px;border-radius:9px;border:1px solid var(--line);background:var(--ink2);color:var(--text);padding:0 12px;font:inherit;}
.btn{height:40px;padding:0 16px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);font-weight:700;}
.btn:hover{border-color:var(--gold);}
.btn.primary{background:var(--gold);color:#2a2008;border-color:var(--gold);}
.links{display:flex;gap:8px;flex-wrap:wrap;}
.sheet h2{font-family:var(--display);font-size:28px;margin:0;}
.sheet h4{margin:4px 0 0;font-family:var(--display);font-size:15px;letter-spacing:.06em;color:var(--muted);font-weight:500;}
.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;line-height:1.45;}
.rules b{color:var(--gold);}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:13px;}
.legend span{display:flex;align-items:center;gap:6px;}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;}
.big{font-size:52px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 16px;}
.statgrid div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding-bottom:6px;font-size:14px;}
.statgrid b{font-variant-numeric:tabular-nums;}
.achs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.ach{border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:12px;color:var(--muted);opacity:.55;}
.ach b{display:block;font-size:14px;color:var(--text);}
.ach.on{opacity:1;border-color:var(--gold);}
.ach.on b{color:var(--gold);}
.newbest{color:var(--gold);font-weight:700;}
.unlock{border:1px solid var(--gold);border-radius:9px;padding:8px 12px;color:var(--gold);font-size:14px;}
.row{display:flex;gap:8px;flex-wrap:wrap;}
.share{background:var(--ink2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13px;white-space:pre-wrap;user-select:all;}

@media (max-width:720px){
  .quests{left:16px;right:16px;width:auto;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 142px);flex-direction:row;flex-wrap:nowrap;overflow-x:auto;}
  .quests h3{display:none;}
  .quest{min-width:150px;}
  .tray{left:16px;right:16px;transform:none;max-width:none;gap:10px;padding:10px;justify-content:space-between;}
  .info{max-width:none;flex:1;}
  #hint{display:none;}
  .nums b{font-size:20px;}
  .iconbtn.zoom{display:none;}
  .statgrid,.achs{grid-template-columns:1fr;}
  .logo{font-size:38px;}
}
@media (prefers-reduced-motion:reduce){.toast{animation-duration:2.4s}}

/* ---------- hub ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:12;display:none;justify-content:center;gap:2px;background:color-mix(in srgb,var(--ink) 95%,transparent);border-top:1px solid var(--line);padding:10px 10px calc(env(safe-area-inset-bottom,0px) + 10px);backdrop-filter:blur(8px);}
body.hub .tabbar{display:flex;}
.tabbar button{flex:1;max-width:124px;min-height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:none;border:0;color:var(--muted);font-size:13px;font-weight:700;letter-spacing:.02em;padding:8px 2px;border-radius:10px;position:relative;}
.tabbar svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round;}
.tabbar button:hover{color:var(--text);}
.tabbar button.on{color:var(--gold);background:var(--panel);}
.tabbar .dot{position:absolute;top:6px;left:calc(50% + 10px);width:11px;height:11px;border-radius:50%;background:var(--bad);border:2px solid var(--ink);display:none;}
.tabbar button.badge .dot{display:block;}
body.hub #overlay{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 112px);}
.hubtop{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;padding-bottom:10px;border-bottom:1px solid var(--line);}
.lvchip{font-family:var(--display);color:#2a2008;background:var(--gold);border-radius:6px;padding:1px 8px;}
.cur{display:flex;align-items:center;gap:5px;}
.coin{display:inline-block;width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe08a,#c9962a);box-shadow:inset 0 0 0 1px #8a6418;}
.gem{display:inline-block;width:10px;height:10px;background:linear-gradient(135deg,#d9efff,#7b8cf0);transform:rotate(45deg);border-radius:2px;margin:0 2px;}
.rib{display:inline-block;width:10px;height:14px;background:#e2735f;clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%);}
.card{border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:12px 14px;display:flex;flex-direction:column;gap:8px;}
.card h3{margin:0;font-family:var(--display);font-size:19px;}
.card p{margin:0;color:var(--muted);font-size:13px;line-height:1.45;}
.card.banner{border-color:var(--gold);background:linear-gradient(160deg,color-mix(in srgb,var(--gold) 14%,var(--panel2)),var(--panel2) 60%);}
.shop{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.shop .card{justify-content:space-between;}
.petgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;}
.pet{border:1px solid var(--gold);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted);}
.pet b{color:var(--text);font-size:14px;}
.pet.off{border-color:var(--line);opacity:.55;}
.signs{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.sgc{border:1px solid var(--line);border-radius:8px;padding:6px 3px;text-align:center;font-size:10px;color:var(--muted);display:flex;flex-direction:column;gap:3px;line-height:1.25;}
.sgc b{font-size:12px;color:var(--text);}
.sgc.done{opacity:.4;}
.sgc.now{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);}
.acts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
.acts .btn{height:auto;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;}
.acts small{font-size:10px;font-weight:500;color:var(--muted);line-height:1.2;}
.tiers{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
.tier{border:1px solid var(--line);border-radius:9px;background:var(--ink2);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--muted);line-height:1.2;text-align:center;}
.tier b{font-family:var(--display);font-size:17px;color:var(--text);}
.tier.ready{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 16%,var(--ink2));}
.tier.got{opacity:.4;}
.tier:disabled{cursor:default;}
.camp-row .btn{white-space:nowrap;}
.yard{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;}
.spot{border:1px solid var(--line);border-radius:10px;background:var(--ink2);padding:10px;display:flex;flex-direction:column;gap:7px;}
.spot.empty{border-style:dashed;color:var(--muted);font-size:13px;}
.spot.empty b{color:var(--text);}
.spot-top{display:flex;gap:10px;align-items:center;}
.spot-top div{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted);}
.spot-top b{font-size:14px;color:var(--text);}
.exs{display:flex;gap:4px;}
.exs .btn{flex:1;height:32px;padding:0 6px;font-size:13px;}
.petpic{width:48px;height:48px;flex:none;}
.petpic.moving{animation:hop .7s ease-in-out infinite alternate;}
@keyframes hop{to{transform:translateY(-5px) rotate(-4deg)}}
.petlist{display:flex;flex-direction:column;gap:8px;}
.petcard{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:10px 12px;}
.petcard{border-color:var(--rc,var(--line));box-shadow:inset 3px 0 0 var(--rc,var(--line));}
.petcard.off{opacity:.5;}
.prar{font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--rc);}
.odds{display:flex;flex-wrap:wrap;gap:6px;}
.odds span{font-size:11px;font-weight:700;border:1px solid var(--rc);color:var(--rc);border-radius:10px;padding:1px 8px;}
.petcard .pc-body,.petcard > div{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0;font-size:13px;color:var(--muted);}
.petcard b{color:var(--text);font-size:15px;}
@media (prefers-reduced-motion:reduce){.petpic.moving{animation:none}}
.tix{font-size:13px;color:var(--gold);font-weight:700;margin-right:auto;}
@media (max-width:520px){ .signs{grid-template-columns:repeat(4,1fr);} .acts{grid-template-columns:repeat(3,1fr);} .tabbar{gap:0;padding-left:4px;padding-right:4px;} .tabbar button{font-size:11px;letter-spacing:0;min-height:62px;} .tabbar svg{width:28px;height:28px;} }

/* ---------- save slots ---------- */
#slots{z-index:20;}
.slot{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center;text-align:left;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);width:100%;}
.slot:hover{border-color:var(--gold);}
.slot .sn{grid-row:1 / 3;font-family:var(--display);font-weight:800;font-size:30px;color:var(--gold);width:34px;text-align:center;}
.slot .st{font-family:var(--display);font-size:19px;font-weight:700;}
.slot .ss{grid-column:2;font-size:13px;color:var(--muted);line-height:1.4;}
.slot .sg{grid-row:1 / 3;grid-column:3;font-size:13px;color:var(--gold);text-align:right;}
.slot.empty .st{color:var(--muted);}
.slotwrap{display:flex;flex-direction:column;gap:6px;}
.slotdel{align-self:flex-end;background:none;border:0;color:var(--muted);font-size:12px;padding:2px 4px;text-decoration:underline;}
.slotdel.arm{color:var(--bad);font-weight:700;}

/* ---------- expedition ---------- */
body.in-exp #board, body.in-exp .hud-top, body.in-exp #quests, body.in-exp .tray{display:none;}
#exp{position:fixed;inset:0;z-index:3;background:#a9cde0;}
#expView{position:absolute;inset:0;}
#expView canvas{display:block;width:100%;height:100%;}
.ex-top{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;}
.ex-top > *{pointer-events:auto;}
.ex-card{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;gap:7px;width:min(300px,100%);}
.days{display:grid;grid-template-columns:repeat(30,1fr);gap:2px;}
.days i{height:6px;border-radius:1px;background:var(--line);}
.days i.done{background:var(--gold);}
.days i.elite{background:#7a4a40;}
.days i.elite.done{background:var(--bad);}
.days i.now{box-shadow:0 0 0 1px var(--text);}
.hpbar{position:relative;height:18px;border-radius:5px;background:#10161e;overflow:hidden;border:1px solid var(--line);}
.hpbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#86d27a,#4f9c49);transition:width .2s;}
.hpbar.red i{background:linear-gradient(#e8836a,#b8493a);}
.hpbar span{position:relative;display:block;text-align:center;font-size:12px;font-weight:700;line-height:16px;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px #000;}
.ex-meta{display:flex;gap:14px;font-size:13px;color:var(--muted);}
.ex-meta b{color:var(--gold);font-variant-numeric:tabular-nums;}
.ex-enemy{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 14px);width:min(280px,calc(100% - 32px));background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:6px;}
.en-name{font-family:var(--display);font-weight:700;font-size:16px;}
.en-name small{font-family:var(--body);font-weight:500;color:var(--muted);font-size:12px;margin-left:6px;}
.ex-skills{position:absolute;left:16px;top:calc(env(safe-area-inset-top,0px) + 134px);display:flex;flex-wrap:wrap;gap:5px;max-width:min(330px,calc(100% - 32px));pointer-events:none;}
.chip{background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--rc,var(--line));border-radius:12px;padding:2px 9px;font-size:12px;font-weight:700;}
.chip small{color:var(--muted);font-weight:500;margin-left:3px;}
.ex-panel{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:min(860px,calc(100% - 24px));max-height:78%;overflow-y:auto;background:color-mix(in srgb,var(--panel) 96%,transparent);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;}
.ep-t{font-family:var(--display);font-weight:700;font-size:26px;}
.ep-b{color:var(--muted);font-size:15px;line-height:1.45;}
.ep-c{display:flex;gap:8px;flex-wrap:wrap;}
.ep-c.cards{display:grid;grid-template-columns:repeat(3,1fr);}
.choice{flex:1 1 200px;text-align:left;padding:14px 16px;min-height:64px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);display:flex;flex-direction:column;gap:2px;}
.choice:hover:not(:disabled){border-color:var(--gold);}
.choice:disabled,.skc:disabled{opacity:.4;cursor:default;}
.choice b{font-size:18px;}
.choice span{font-size:14px;color:var(--muted);}
.skc{text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--rc);background:var(--panel2);display:flex;flex-direction:column;gap:3px;box-shadow:inset 0 3px 0 var(--rc);transition:transform .12s;}
.skc:hover:not(:disabled){transform:translateY(-2px);}
.skc .sk-r{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--rc);font-weight:700;}
.skc b{font-family:var(--display);font-size:17px;}
.skc .sk-l{font-size:12px;color:var(--gold);}
.skc .sk-d{font-size:13px;color:var(--muted);line-height:1.35;}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
window.startMeadowmark = (SLOT) => {
"use strict";
const SQ3 = Math.sqrt(3);
const T = [
  {n:"Meadow",  c:"#9bc46b", d:"#86b058"},
  {n:"Forest",  c:"#3f7d4e", d:"#2b5e39"},
  {n:"Wheat",   c:"#e3c15a", d:"#caa640"},
  {n:"Water",   c:"#4f9bd1", d:"#3b86bd"},
  {n:"Village", c:"#c9795a", d:"#b0644a"},
];
const TW = [3, 3, 2.4, 1.6, 1.4];
const DIRS = [[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
const K = (q,r) => q + "," + r;
const unK = k => k.split(",").map(Number);
const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString("en-US");

/* ---------- storage ---------- */
const STORE_KEY = SLOT === 1 ? "meadowmark.v1" : "meadowmark.v1.slot" + SLOT;
let mem = null;
function loadStore(){
  try { const s = localStorage.getItem(STORE_KEY); if (s) return JSON.parse(s); } catch(e){}
  return mem || {};
}
function saveStore(){
  DB.lastPlayed = Date.now();
  const tr = DB.exp && DB.exp.run && DB.exp.run.trial ? DB.exp.run : null;
  if (tr) DB.exp.run = TRIAL_SAVED || null;
  try { localStorage.setItem(STORE_KEY, JSON.stringify(DB)); } catch(e){ mem = DB; }
  if (tr) DB.exp.run = tr;
}
const DB = loadStore();
DB.stats = Object.assign({xp:0,games:0,tiles:0,quests:0,perfects:0,bestEndless:0,bestGame:0,daily:{},dailyCount:0,streak:0,bestStreak:0,lastDaily:null,seeds:{},ach:{},maxRegion:[0,0,0,0,0]}, DB.stats || {});
DB.saves = DB.saves || {};
const ST = DB.stats;

/* ---------- dates, levels ---------- */
const pad = n => String(n).padStart(2,"0");
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => dstr(new Date());
const yesterday = () => { const d = new Date(); d.setDate(d.getDate()-1); return dstr(d); };
const niceDate = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString("en-US",{month:"short",day:"numeric"}); };
const TITLES = ["Wanderer","Settler","Shepherd","Homesteader","Miller","Reeve","Steward","Surveyor","Cartographer","Warden","Landgrave","Marquess of Meadows","Keeper of the Long Map"];
const lvlStart = n => 300*n*(n-1);
function levelOf(xp){ let n = 1; while (xp >= lvlStart(n+1)) n++; return n; }
const titleOf = n => TITLES[Math.min(n-1, TITLES.length-1)];

/* ---------- rng ---------- */
function hashStr(s){ let h = 2166136261; for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h|0; }
function rnd(){
  S.rng = (S.rng + 0x6D2B79F5) | 0;
  let t = S.rng;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function pickW(ws){ let s = ws.reduce((a,b)=>a+b,0), x = rnd()*s; for (let i=0;i<ws.length;i++){ x -= ws[i]; if (x < 0) return i; } return ws.length-1; }

/* ---------- tiles ---------- */
function genTile(allowQuest){
  const k = [1,2,3,4][pickW([.14,.5,.3,.06])];
  const ws = TW.slice(), terr = [];
  for (let i=0;i<k;i++){ const t = pickW(ws); terr.push(t); ws[t] = 0; }
  const len = new Array(k).fill(1);
  for (let i=0;i<6-k;i++) len[Math.floor(rnd()*k)]++;
  let edges = [];
  terr.forEach((t,i)=>{ for (let j=0;j<len[i];j++) edges.push(t); });
  const off = Math.floor(rnd()*6);
  edges = edges.map((_,i)=>edges[(i+off)%6]);
  let quest = null;
  if (allowQuest && rnd() < 0.2){
    const opts = terr.filter(t => t !== 0);
    if (opts.length){
      const terrain = opts[Math.floor(rnd()*opts.length)];
      const exact = rnd() < 0.68;
      quest = {terrain, type: exact ? "exact" : "close", delta: exact ? 2 + Math.floor(rnd()*8) : 1 + Math.floor(rnd()*4)};
    }
  }
  return {id: S.nextId++, edges, quest};
}
function segOf(edges){
  const seg = new Array(6).fill(0);
  let start = -1;
  for (let i=0;i<6;i++) if (edges[i] !== edges[(i+5)%6]) { start = i; break; }
  if (start < 0) return seg;
  let id = -1;
  for (let j=0;j<6;j++){ const i = (start+j)%6; if (edges[i] !== edges[(i+5)%6]) id++; seg[i] = id; }
  return seg;
}
const rotated = (edges, r) => edges.map((_,i)=>edges[(i+r)%6]);

function region(key, seg){
  const seen = new Set(), stack = [[key,seg]];
  let closed = true, open = 0;
  seen.add(key+"|"+seg);
  while (stack.length){
    const [k,s] = stack.pop();
    const t = S.tiles[k];
    for (let e=0;e<6;e++){
      if (t.seg[e] !== s) continue;
      const nk = K(t.q+DIRS[e][0], t.r+DIRS[e][1]);
      const n = S.tiles[nk];
      if (!n){ closed = false; open++; continue; }
      const oe = (e+3)%6;
      if (n.edges[oe] === t.edges[e]){
        const id = nk+"|"+n.seg[oe];
        if (!seen.has(id)){ seen.add(id); stack.push([nk, n.seg[oe]]); }
      }
    }
  }
  return {size: seen.size, closed, open};
}

/* ---------- game state ---------- */
let S = null;
let cand = new Set();
let hover = null, selected = null;
const cam = {x:0, y:0, z:44};

function newGame(mode, seedText){
  const date = today();
  const lvl = levelOf(ST.xp);
  const seedStr = mode === "daily" ? "daily-" + date : mode === "seed" ? "seed-" + seedText.trim().toLowerCase() : "endless-" + Date.now();
  S = {mode, seedText: seedText || "", date, rng: hashStr(seedStr), tiles:{}, queue:[], rot:0,
       tilesLeft: mode === "endless" ? 40 + Math.min(lvl-1, 20) : 40,
       score:0, quests:[], nextId:1, placed:0, perfects:0, questsDone:0, questsFailed:0, matched:0,
       maxRegion:[0,0,0,0,0], over:false};
  const base = mode === "endless" && DB.dmaps && DB.dmaps[yesterday()];
  if (base){
    let mx = 0;
    base.tiles.forEach(([q,r,e,id]) => { const edges = e.split("").map(Number); S.tiles[K(q,r)] = {q, r, edges, seg:segOf(edges), id}; mx = Math.max(mx, id); });
    S.nextId = mx + 1; S.fromDaily = yesterday();
  } else {
    let start = genTile(false);
    while (new Set(start.edges).size < 2) start = genTile(false);
    S.tiles[K(0,0)] = {q:0, r:0, edges:start.edges, seg:segOf(start.edges), id:start.id};
  }
  refill();
}
function refill(){ while (S.queue.length < Math.min(3, S.tilesLeft)) S.queue.push(genTile(true)); }
function rebuildCand(){
  cand = new Set();
  for (const k in S.tiles){ const t = S.tiles[k];
    for (const [dq,dr] of DIRS){ const nk = K(t.q+dq, t.r+dr); if (!S.tiles[nk]) cand.add(nk); } }
}
function persist(){
  if (S.over) delete DB.saves[S.mode]; else DB.saves[S.mode] = S;
  saveStore();
}

function preview(k){
  const [q,r] = unK(k), cur = S.queue[0];
  const edges = rotated(cur.edges, S.rot);
  const marks = [];
  for (let e=0;e<6;e++){
    const n = S.tiles[K(q+DIRS[e][0], r+DIRS[e][1])];
    if (n) marks.push([e, n.edges[(e+3)%6] === edges[e]]);
  }
  return {edges, marks};
}

let anim = null;
function place(k){
  if (!S || S.over || !cand.has(k) || !S.queue.length) return;
  const [q,r] = unK(k);
  const cur = S.queue.shift();
  const edges = rotated(cur.edges, S.rot);
  const tile = {q, r, edges, seg: segOf(edges), id: cur.id};
  S.tiles[k] = tile;
  cand.delete(k);
  for (const [dq,dr] of DIRS){ const nk = K(q+dq, r+dr); if (!S.tiles[nk]) cand.add(nk); }
  S.tilesLeft--; S.placed++; S.rot = 0; ST.tiles++; track("tiles");

  let n = 0, m = 0;
  for (let e=0;e<6;e++){
    const nb = S.tiles[K(q+DIRS[e][0], r+DIRS[e][1])];
    if (nb){ n++; if (nb.edges[(e+3)%6] === edges[e]) m++; }
  }
  const pts = m*10;
  S.score += pts; S.matched += m;
  if (pts) toast("+" + pts, "");
  if (n >= 3 && m === n){
    const bonus = n === 6 ? 2 : 1;
    S.tilesLeft += bonus; S.perfects++; ST.perfects++;
    toast(`Perfect fit · +${bonus} tile${bonus>1?"s":""}`, "gold");
  }

  if (cur.quest && S.quests.filter(x=>x.status==="active").length < 5){
    const qi = edges.indexOf(cur.quest.terrain);
    if (qi >= 0){
      const reg = region(k, tile.seg[qi]);
      if (!(cur.quest.type === "close" && reg.closed)){
        S.quests.push({key:k, seg:tile.seg[qi], terrain:cur.quest.terrain, type:cur.quest.type,
                       target: reg.size + cur.quest.delta, size: reg.size, open: reg.open, status:"active"});
        toast(`New quest · ${T[cur.quest.terrain].n}`, "");
      }
    }
  }
  for (const qu of S.quests){
    if (qu.status !== "active") continue;
    const reg = region(qu.key, qu.seg);
    qu.size = reg.size; qu.open = reg.open;
    if (qu.type === "exact"){
      if (reg.size === qu.target){
        const b = qu.target >= 8 ? 5 : 4, p = qu.target*10;
        qu.status = "done"; S.questsDone++; ST.quests++; track("quest"); S.tilesLeft += b; S.score += p;
        toast(`Quest done · +${p} · +${b} tiles`, "good");
      } else if (reg.size > qu.target){ qu.status = "failed"; S.questsFailed++; toast(`Quest lost · ${T[qu.terrain].n} overgrew`, "bad"); }
    } else if (reg.closed){
      if (reg.size >= qu.target){
        const p = reg.size*8;
        qu.status = "done"; S.questsDone++; ST.quests++; track("quest"); S.tilesLeft += 3; S.score += p;
        toast(`Enclosed · +${p} · +3 tiles`, "good");
      } else { qu.status = "failed"; S.questsFailed++; toast(`Quest lost · closed too small`, "bad"); }
    }
  }
  S.quests = S.quests.filter(x => x.status === "active");
  const done = new Set();
  for (let e=0;e<6;e++){
    const s = tile.seg[e]; if (done.has(s)) continue; done.add(s);
    const t = edges[e], sz = region(k, s).size;
    if (sz > S.maxRegion[t]) S.maxRegion[t] = sz;
  }
  refill();
  selected = null;
  anim = {k, t0: performance.now()};
  if (S.tilesLeft <= 0){ S.over = true; setTimeout(finish, 650); }
  persist();
  updateHUD(); loop();
}

/* ---------- achievements ---------- */
const ACH = [
  ["first","First Furrow","Finish a map", g=>true],
  ["k1","Thousand Acres","Score 1,000 in one map", g=>g.score>=1000],
  ["k5","A Proper Shire","Score 5,000 in one map", g=>g.score>=5000],
  ["k15","Kingdom","Score 15,000 in one map", g=>g.score>=15000],
  ["tidy","Tidy Hands","10 perfect fits in one map", g=>g.perfects>=10],

const G0 = {score:0, perfects:0, questsDone:0, placed:0, maxRegion:[0,0,0,0,0]};
function unlockAch(g){
  const out = [];
  for (const [id,name,desc,chk] of ACH) if (!ST.ach[id] && chk(g)){ ST.ach[id] = today(); out.push([name,desc]); }
  return out;
}

function finish(){
  const g = S;
  const lvlBefore = levelOf(ST.xp);
  ST.games++; ST.xp += g.score;
  if (g.score > ST.bestGame) ST.bestGame = g.score;
  for (let i=0;i<5;i++) ST.maxRegion[i] = Math.max(ST.maxRegion[i], g.maxRegion[i]);
  let best = false, prev = 0;
  if (g.mode === "daily"){
    prev = ST.daily[g.date] || 0;
    if (!ST.daily[g.date]){
      ST.dailyCount++;
      ST.streak = ST.lastDaily === yesterday() || ST.lastDaily === g.date ? ST.streak + (ST.lastDaily === g.date ? 0 : 1) : 1;
      ST.lastDaily = g.date;
      ST.bestStreak = Math.max(ST.bestStreak, ST.streak);
    }
    if (g.score > prev){ ST.daily[g.date] = g.score; best = prev > 0; }
    DB.dmaps = DB.dmaps || {};
    const old = DB.dmaps[g.date];
    if (!old || g.score >= old.score) DB.dmaps[g.date] = {score:g.score, tiles:Object.values(g.tiles).map(t => [t.q, t.r, t.edges.join(""), t.id])};
    Object.keys(DB.dmaps).sort().slice(0, -3).forEach(k => delete DB.dmaps[k]);
  } else if (g.mode === "endless"){
    prev = ST.bestEndless; if (g.score > prev){ ST.bestEndless = g.score; best = prev > 0; }
  } else {
    const sk = g.seedText.trim().toLowerCase(); prev = ST.seeds[sk] || 0;
    if (g.score > prev){ ST.seeds[sk] = g.score; best = prev > 0; }
  }
  track("map"); if (g.mode === "daily") track("daily");
  const unlocked = unlockAch(g);
  g.goldEarned = Math.floor(g.score/25);
  EX.gold += g.goldEarned;
  delete DB.saves[g.mode];
  saveStore();
  showOver(g, best, unlocked, lvlBefore, levelOf(ST.xp));
}

/* ---------- canvas ---------- */
const cv = $("board"), ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  loop();
}
function prep(c, w, h){ c.width = w*DPR; c.height = h*DPR; c.style.width = w+"px"; c.style.height = h+"px"; const x = c.getContext("2d"); x.setTransform(DPR,0,0,DPR,0,0); return x; }

const toWorld = (q,r) => [SQ3*(q + r/2), 1.5*r];
const toScreen = (q,r) => { const [x,y] = toWorld(q,r); return [x*cam.z + cam.x, y*cam.z + cam.y]; };
function toAxial(sx, sy){
  const wx = (sx-cam.x)/cam.z, wy = (sy-cam.y)/cam.z;
  let q = SQ3/3*wx - wy/3, r = 2/3*wy, s = -q-r;
  let rq = Math.round(q), rr = Math.round(r), rs = Math.round(s);
  const dq = Math.abs(rq-q), dr = Math.abs(rr-r), ds = Math.abs(rs-s);
  if (dq > dr && dq > ds) rq = -rr-rs; else if (dr > ds) rr = -rq-rs;
  return K(rq, rr);
}
const ang = e => -Math.PI/3*e;
function corner(cx, cy, s, a){ return [cx + s*Math.cos(a), cy + s*Math.sin(a)]; }
function hexPath(c, cx, cy, s){
  c.beginPath();
  for (let i=0;i<6;i++){ const [x,y] = corner(cx,cy,s,Math.PI/6 + Math.PI/3*i); i ? c.lineTo(x,y) : c.moveTo(x,y); }
  c.closePath();
}
function hh(a, b){ let h = Math.imul(a ^ 0x9e3779b9, 2654435761) ^ Math.imul(b + 0x7f4a7c15, 1597334677); h ^= h >>> 13; h = Math.imul(h, 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }

function drawTile(c, cx, cy, s, edges, id, alpha){
  c.save(); c.globalAlpha = alpha ?? 1;
  for (let e=0;e<6;e++){
    const a = ang(e), [x1,y1] = corner(cx,cy,s,a-Math.PI/6), [x2,y2] = corner(cx,cy,s,a+Math.PI/6);
    c.beginPath(); c.moveTo(cx,cy); c.lineTo(x1,y1); c.lineTo(x2,y2); c.closePath();
    c.fillStyle = T[edges[e]].c; c.fill();
    c.strokeStyle = T[edges[e]].c; c.lineWidth = 1; c.stroke();
  }
  if (s >= 14) for (let e=0;e<6;e++) deco(c, cx, cy, s, e, edges[e], id);
  hexPath(c, cx, cy, s*0.985);
  c.strokeStyle = "rgba(10,16,24,.45)"; c.lineWidth = Math.max(1, s*0.04); c.stroke();
  c.restore();
}
function deco(c, cx, cy, s, e, t, id){
  const a = ang(e), ux = Math.cos(a), uy = Math.sin(a), px = -uy, py = ux;
  const j1 = hh(id, e) - .5, j2 = hh(id, e+11) - .5;
  const d = s*(0.56 + j2*0.12), o = s*j1*0.22;
  const x = cx + ux*d + px*o, y = cy + uy*d + py*o;
  c.save();
  if (t === 1){
    for (const k of [-1, 1]){
      const tx = x + px*s*0.13*k, ty = y + py*s*0.13*k + (k>0 ? s*0.03 : 0);
      c.fillStyle = "#285a36"; c.beginPath();
      c.moveTo(tx, ty - s*0.17); c.lineTo(tx + s*0.1, ty + s*0.06); c.lineTo(tx - s*0.1, ty + s*0.06); c.closePath(); c.fill();
      c.fillStyle = "#5a9a64"; c.beginPath(); c.moveTo(tx, ty - s*0.17); c.lineTo(tx + s*0.04, ty - s*0.06); c.lineTo(tx - s*0.03, ty - s*0.06); c.fill();
    }
  } else if (t === 2){
    c.strokeStyle = "#f6e29a"; c.lineWidth = Math.max(1, s*0.035); c.lineCap = "round";
    for (let i=-1;i<=1;i++){
      const bx = x + px*s*0.1*i, by = y + py*s*0.1*i;
      c.beginPath(); c.moveTo(bx + ux*s*0.08, by + uy*s*0.08); c.lineTo(bx - ux*s*0.08, by - uy*s*0.08); c.stroke();
    }
  } else if (t === 3){
    c.strokeStyle = "#a6d6f5"; c.lineWidth = Math.max(1, s*0.035); c.lineCap = "round";
    for (const k of [-0.06, 0.07]){
      const bx = x + ux*s*k, by = y + uy*s*k;
      c.beginPath();
      c.moveTo(bx - s*0.12, by);
      c.quadraticCurveTo(bx - s*0.06, by - s*0.05, bx, by);
      c.quadraticCurveTo(bx + s*0.06, by + s*0.05, bx + s*0.12, by);
      c.stroke();
    }
  } else if (t === 4){
    for (const k of [-1, 1]){
      const hx = x + px*s*0.12*k, hy = y + py*s*0.12*k, w = s*0.15, h2 = s*0.11;
      c.fillStyle = "#f2e4c8"; c.fillRect(hx - w/2, hy - h2/2, w, h2);
      c.fillStyle = "#7c3d2b"; c.beginPath(); c.moveTo(hx - w*0.62, hy - h2/2); c.lineTo(hx, hy - h2/2 - s*0.1); c.lineTo(hx + w*0.62, hy - h2/2); c.closePath(); c.fill();
    }
  } else {
    c.fillStyle = "#cfe7a4";
    c.beginPath(); c.arc(x, y, s*0.03, 0, 7); c.fill();
    c.beginPath(); c.arc(x + px*s*0.09, y + py*s*0.09 + s*0.04, s*0.025, 0, 7); c.fill();
  }
  c.restore();
}

let raf = 0;
function loop(){ if (!raf) raf = requestAnimationFrame(draw); }
function draw(){
  raf = 0;
  ctx.fillStyle = "#131c27"; ctx.fillRect(0,0,W,H);
  const g = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H)*0.7);
  g.addColorStop(0, "rgba(40,60,80,.35)"); g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  if (!S) return;
  const s = cam.z, pad = s*1.2;
  const ghost = selected || (hover && cand.has(hover) ? hover : null);

  for (const k of cand){
    const [q,r] = unK(k), [x,y] = toScreen(q,r);
    if (x < -pad || y < -pad || x > W+pad || y > H+pad) continue;
    hexPath(ctx, x, y, s*0.9);
    ctx.fillStyle = k === ghost ? "rgba(240,195,90,.10)" : "rgba(255,255,255,.035)"; ctx.fill();
    ctx.strokeStyle = k === ghost ? "rgba(240,195,90,.7)" : "rgba(200,220,240,.16)"; ctx.lineWidth = 1.2; ctx.stroke();
  }
  let animating = false;
  for (const k in S.tiles){
    const t = S.tiles[k], [x,y] = toScreen(t.q, t.r);
    if (x < -pad || y < -pad || x > W+pad || y > H+pad) continue;
    let sc = 1;
    if (anim && anim.k === k){
      const p = (performance.now() - anim.t0)/260;
      if (p < 1){ sc = 0.82 + 0.18*(1 - Math.pow(1-p, 3)) + Math.sin(p*Math.PI)*0.05; animating = true; } else anim = null;
    }
    drawTile(ctx, x, y, s*sc, t.edges, t.id, 1);
  }
  for (const qu of S.quests){
    const t = S.tiles[qu.key]; if (!t) continue;
    const [x,y] = toScreen(t.q, t.r), rad = Math.max(9, s*0.3);
    ctx.beginPath(); ctx.arc(x, y, rad, 0, 7);
    ctx.fillStyle = "#1c2733"; ctx.fill();
    ctx.lineWidth = Math.max(2, s*0.07); ctx.strokeStyle = T[qu.terrain].c;
    ctx.setLineDash(qu.type === "close" ? [s*0.08, s*0.06] : []); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = "#eef0e3"; ctx.font = `700 ${Math.round(rad*1.05)}px "Alegreya Sans", system-ui, sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(String(Math.max(0, qu.target - qu.size)), x, y + 1);
  }
  if (ghost && S.queue.length && !S.over){
    const [q,r] = unK(ghost), [x,y] = toScreen(q,r), pv = preview(ghost);
    drawTile(ctx, x, y, s, pv.edges, S.queue[0].id, 0.9);
    for (const [e, ok] of pv.marks){
      const a = ang(e), mx = x + Math.cos(a)*s*0.72, my = y + Math.sin(a)*s*0.72, mr = Math.max(4, s*0.1);
      ctx.beginPath(); ctx.arc(mx, my, mr, 0, 7);
      ctx.fillStyle = ok ? "#8fd18a" : "#e2735f"; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = "#131c27"; ctx.stroke();
    }
  }
  if (animating) loop();
}

/* ---------- HUD ---------- */
function updateHUD(){
  if (!S) return;
  $("score").textContent = fmt(S.score);
  $("left").textContent = S.tilesLeft;
  $("left").classList.toggle("low", S.tilesLeft <= 5);
  $("modeLabel").textContent = S.mode === "daily" ? `Daily Map · ${niceDate(S.date)}` : S.mode === "endless" ? (S.fromDaily ? `Endless · on your ${niceDate(S.fromDaily)} map` : "Endless") : `Seed · ${S.seedText}`;
  const ql = $("questList");
  ql.innerHTML = "";
  if (!S.quests.length){ const d = document.createElement("div"); d.className = "q-empty"; d.textContent = "Tiles marked with a ring start quests."; ql.appendChild(d); }
  for (const qu of S.quests){
    const b = document.createElement("button");
    b.className = "quest";
    const pct = Math.min(100, qu.size/qu.target*100);
    const sub = qu.type === "exact" ? `Exactly ${qu.target} · going over fails` : `Enclose it · at least ${qu.target} · ${qu.open} open edge${qu.open===1?"":"s"}`;
    b.innerHTML = `<span class="sw" style="background:${T[qu.terrain].c}"></span><span class="qt">${T[qu.terrain].n}</span><span class="qn">${qu.size}/${qu.target}</span><span class="qs">${sub}</span><span class="bar"><i style="width:${pct}%;background:${T[qu.terrain].c}"></i></span>`;
    b.onclick = () => { const t = S.tiles[qu.key]; if (t){ const [x,y] = toWorld(t.q,t.r); cam.x = W/2 - x*cam.z; cam.y = H*0.45 - y*cam.z; loop(); } };
    ql.appendChild(b);
  }
  const c0 = prep($("curTile"), 92, 92), c1 = prep($("next1"), 44, 44), c2 = prep($("next2"), 44, 44);
  const cur = S.queue[0];
  if (cur){
    drawTile(c0, 46, 46, 42, rotated(cur.edges, S.rot), cur.id, 1);
    if (cur.quest){
      c0.beginPath(); c0.arc(46, 46, 12, 0, 7); c0.fillStyle = "#1c2733"; c0.fill();
      c0.lineWidth = 3; c0.strokeStyle = T[cur.quest.terrain].c; c0.setLineDash(cur.quest.type === "close" ? [4,3] : []); c0.stroke(); c0.setLineDash([]);
      c0.fillStyle = "#eef0e3"; c0.font = '700 13px "Alegreya Sans", system-ui'; c0.textAlign = "center"; c0.textBaseline = "middle"; c0.fillText("+" + cur.quest.delta, 46, 47);
    }
  }
  [c1, c2].forEach((c, i) => { const t = S.queue[i+1]; if (t) drawTile(c, 22, 22, 20, t.edges, t.id, 0.9); });
  const qh = $("questHint");
  if (cur && cur.quest){
    qh.hidden = false;
    qh.textContent = cur.quest.type === "exact"
      ? `Quest tile: grow its ${T[cur.quest.terrain].n.toLowerCase()} by exactly ${cur.quest.delta}`
      : `Quest tile: enclose its ${T[cur.quest.terrain].n.toLowerCase()} after ${cur.quest.delta}+ more`;
  } else qh.hidden = true;
  $("placeBtn").disabled = !(selected || (hover && cand.has(hover))) || S.over;
}
function toast(text, cls){
  const d = document.createElement("div"); d.className = "toast " + (cls||""); d.textContent = text;
  $("toasts").appendChild(d); setTimeout(() => d.remove(), 1950);
  const all = $("toasts").children; if (all.length > 4) all[0].remove();
}
function rotate(d){ if (!S || !S.queue.length) return; S.rot = (S.rot + d + 6) % 6; updateHUD(); loop(); }
function zoomAt(px, py, z){
  z = Math.max(12, Math.min(110, z));
  const wx = (px-cam.x)/cam.z, wy = (py-cam.y)/cam.z;
  cam.z = z; cam.x = px - wx*z; cam.y = py - wy*z; loop();
}
function centerView(){
  if (!S) return;
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for (const k in S.tiles){ const t = S.tiles[k], [x,y] = toWorld(t.q,t.r); x0=Math.min(x0,x); y0=Math.min(y0,y); x1=Math.max(x1,x); y1=Math.max(y1,y); }
  const small = W < 720;
  const availH = H - (small ? 330 : 240), availW = W - (small ? 40 : 520);
  const z = Math.max(16, Math.min(small ? 40 : 52, availW/(x1-x0+4), availH/(y1-y0+4)));
  cam.z = z;
  cam.x = W/2 - (x0+x1)/2*z;
  cam.y = (small ? 90 : 90) + availH/2 + 10 - (y0+y1)/2*z;
  loop();
}

/* ---------- input ---------- */
const ptrs = new Map(); let drag = null, pinch = null;
cv.addEventListener("pointerdown", e => {
  if (e.button === 2) return;
  cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (ptrs.size === 1) drag = {x0:e.clientX, y0:e.clientY, cx:cam.x, cy:cam.y, moved:false};
  if (ptrs.size === 2){
    const [a,b] = [...ptrs.values()];
    pinch = {d0: Math.hypot(a.x-b.x, a.y-b.y), z0: cam.z};
    if (drag) drag.moved = true;
  }
});
cv.addEventListener("pointermove", e => {
  if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (pinch && ptrs.size === 2){
    const [a,b] = [...ptrs.values()];
    zoomAt((a.x+b.x)/2, (a.y+b.y)/2, pinch.z0 * Math.hypot(a.x-b.x, a.y-b.y) / pinch.d0);
    return;
  }
  if (drag && ptrs.size === 1){
    const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
    if (!drag.moved && Math.hypot(dx,dy) > 6) drag.moved = true;
    if (drag.moved){ cam.x = drag.cx + dx; cam.y = drag.cy + dy; loop(); }
  }
  if (e.pointerType === "mouse" && S){
    const h = toAxial(e.clientX, e.clientY);
    if (h !== hover){ hover = h; loop(); $("placeBtn").disabled = !(selected || cand.has(hover)) || S.over; }
  }
});
function endPtr(e){
  const wasTap = drag && !drag.moved && e.type === "pointerup" && ptrs.size === 1;
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  if (wasTap) tap(e);
  if (ptrs.size === 0) drag = null;
}
cv.addEventListener("pointerup", endPtr);
cv.addEventListener("pointercancel", endPtr);
cv.addEventListener("pointerleave", e => { if (e.pointerType === "mouse"){ hover = null; loop(); } });
function tap(e){
  if (!S || S.over) return;
  const k = toAxial(e.clientX, e.clientY);
  if (!cand.has(k)){ selected = null; updateHUD(); loop(); return; }
  if (e.pointerType === "mouse" || selected === k) place(k);
  else { selected = k; updateHUD(); loop(); }
}
let wheelAcc = 0;
cv.addEventListener("wheel", e => {
  e.preventDefault();
  if (e.ctrlKey){ zoomAt(e.clientX, e.clientY, cam.z * Math.exp(-e.deltaY*0.01)); return; }
  wheelAcc += e.deltaY;
  if (Math.abs(wheelAcc) >= 40){ rotate(wheelAcc > 0 ? 1 : -1); wheelAcc = 0; }
}, {passive:false});
cv.addEventListener("contextmenu", e => { e.preventDefault(); rotate(-1); });
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (!$("overlay").hidden || document.body.classList.contains("in-exp")){ return; }
  const k = e.key.toLowerCase();
  if (k === "q" || k === "arrowleft") rotate(-1);
  else if (k === "e" || k === "r" || k === "arrowright") rotate(1);
  else if (k === "enter" || k === " "){ e.preventDefault(); const t = selected || hover; if (t) place(t); }
  else if (k === "c") centerView();
  else if (k === "escape") showHome();
});
$("rotL").onclick = () => rotate(-1);
$("rotR").onclick = () => rotate(1);
$("placeBtn").onclick = () => { const t = selected || hover; if (t) place(t); };
$("zoomIn").onclick = () => zoomAt(W/2, H/2, cam.z*1.2);
$("zoomOut").onclick = () => zoomAt(W/2, H/2, cam.z/1.2);
$("centerBtn").onclick = centerView;
$("menuBtn").onclick = () => showHome();
addEventListener("resize", resize);

const sheet = $("sheet"), overlay = $("overlay");

function levelBlock(){

}

function start(mode, seedText){

function showHow(){

function ensureRenderer(){

function expFrame(now){

  for (let i = tweens.length - 1; i >= 0; i--){
    const tw = tweens[i], p = Math.min(1, (now - tw.t0)/tw.dur);

  }

  if (TB){ V.hl *= .72; V.el *= .8; }

  requestAnimationFrame(expFrame);
}

function eventFor(day, info){

async function doEvent(ev, tok){
  const run = EX.run;
  if (ev.kind === "skill"){
    if (!ev.offers.length){ healHero(Math.round(hs().maxHp*.3)); return null; }
    const k = await choose(ev.title, ev.body, ev.offers.map(id => skillCard(id)), true);
    if (tok !== expToken) return "abort";
    if (await learn(ev.offers[k], tok) === null) return "abort";
    return null;
  }
  if (ev.kind === "battle"){
    const win = ev.tap ? await tapBattle(ev, tok) : await battle(ev, tok);
    if (win === null) return "abort";
    if (!win) return "dead";
    if (ev.tier === 2 && !ev.den) return "boss";
    if (ev.tier >= 1 || Math.random() < .4) return {next: {kind:"skill", title: ev.den ? "Den spoils" : ev.tier === 1 ? "Elite spoils" : "Spoils", body:"Something useful was left behind. Pick one.", offers: rollOffers(3)}};
    return null;
  }
  if (ev.kind === "harvest"){
    const c = Math.round((8 + run.day*.6)*cmul());
    const k = await choose("Wheat field", "A farmer mouse waves from the stubble.", [
      {html:`<b>Help with the harvest</b><span>+${c} coins and +1 Grain</span>`},
      {html:`<b>Nap in the sheaves</b><span>Heal 25% HP</span>`}]);
    if (tok !== expToken) return "abort";
    if (k === 0){ run.coins += c; run.res[2]++; floatAt("hero", "+" + c + " coins", "gold"); } else healHero(Math.round(hs().maxHp*.25));
    return null;
  }
  if (ev.kind === "spring"){
    const k = await choose("Clear spring", "Cold water bubbles up between the stones.", [
      {html:`<b>Drink deeply</b><span>Heal 35% HP</span>`},
      {html:`<b>Go fishing</b><span>Half the time a skill, otherwise 2 Fish</span>`}]);
    if (tok !== expToken) return "abort";
    if (k === 0){ healHero(Math.round(hs().maxHp*.35)); return null; }
    if (Math.random() < .5) return {next: {kind:"skill", title:"A lucky catch", body:"Something glints in the net. Pick one.", offers: rollOffers(3)}};
    run.res[3] += 2; floatAt("hero", "+2 Fish", "gold"); return null;
  }
  if (ev.kind === "market"){
    while (true){
      const price = id => Math.round([30,55,85][SKB[id].r]*cmul());
      const soup = Math.round(22*cmul());
      const list = ev.offers.map(id => { const c = skillCard(id, `<span class="sk-p">${price(id)} coins</span>`); c.disabled = run.coins < price(id); return c; });
      list.push({html:`<b>Bowl of soup</b><span>Heal 40% HP · ${soup} coins</span>`, disabled: run.coins < soup || run.hp >= hs().maxHp});
      list.push({html:`<b>Move on</b><span>Keep walking</span>`});
      const k = await choose("Village market", `A vole with a handcart sells tricks and hot soup. You have ${run.coins} coins.`, list, false);
      if (tok !== expToken) return "abort";
      if (k === list.length - 1) return null;
      if (k === list.length - 2){ run.coins -= soup; healHero(Math.round(hs().maxHp*.4)); }
      else {
        const id = ev.offers[k], got = await learn(id, tok);
        if (got === null) return "abort";
        if (got){ run.coins -= price(id); ev.offers.splice(k, 1); }
      }
      saveStore(); expHUD();
    }
  }
  return null;
}

async function battle(ev, tok){
  const run = EX.run, h = hs(), L = id => run.sk[id] || 0;

    turn++;
    const atk = h.atk*(run.hp < h.maxHp*.5 ? 1 + .25*L("rage") : 1);

    }
    if (L("fire") && turn % 3 === 0 && e.hp > 0){ await wait(120); hit(Math.round(atk*(1 + .5*L("fire"))), "fire", "Ember "); }
    if (e.hp <= 0) break;
    await wait(150);
    acc += e.speed; const swingsE = Math.floor(acc); acc -= swingsE;
    let down = false;
    for (let sw = 0; sw < swingsE && !down; sw++){
    if (sw) await wait(120);
    if (L("frost") && Math.random() < .1*L("frost")) floatAt("enemy", "Frozen", "zap");
    else {
      await tween(170, p => { V.el = Math.sin(Math.PI*p); });
      let d = Math.max(1, Math.round(e.atk*(.9 + Math.random()*.2)*(1 - h.red) - h.def));
      if (shield > 0){ const a = Math.min(shield, d); shield -= a; d -= a; if (a) floatAt("hero", "Blocked " + a, "zap"); }

      if (L("thorn") && d > 0) hit(Math.max(1, Math.round(d*.15*L("thorn"))), "", "Thorns ");
      if (run.hp <= 0){
        if (L("spirit") && !revived){ revived = true; run.hp = Math.round(h.maxHp*.5); floatAt("hero", "Back on my feet", "heal"); }
        else { run.hp = 0; expHUD(); down = true; }
      }
    }
    }
    if (down) break;
    if (poison && e.hp > 0) hit(Math.max(1, Math.round(atk*.08*L("poison")*poison)), "poison", "Poison ");
    if (L("tea")) healHero(Math.round(h.maxHp*.03*L("tea")));

  }

  if (run.hp <= 0){ await tween(650, p => { V.hDead = p; }); $("exEnemy").hidden = true; return false; }
  await tween(450, p => { V.eSink = p; });
  V.eShow = false; $("exEnemy").hidden = true;
  winRewards(ev);
  return true;
}

async function runLoop(){
  const tok = ++expToken;
  expHUD();
  while (EX.run && tok === expToken){
    const run = EX.run;
    if (!run.pending){
      const o = await choosePath();
      if (tok !== expToken) return;
      run.trail.push([o.q, o.r]); run.day++;
      const yl = o.yld*(EVENT().dbl.includes(o.t) ? 2 : 1);
      run.res[o.t] += yl; track("day");
      run.pending = eventFor(run.day, o);
      saveStore();
      R.setTrail(trailInfo(run));
      await walkTo(run.trail.length - 1);
      if (tok !== expToken) return;
      R.refresh();
      floatAt("hero", `+${yl} ${RES[o.t].n}`, "gold");
      expHUD();
    }
    const res = await doEvent(run.pending, tok);
    if (tok !== expToken || res === "abort") return;
    if (res === "dead") return endRun(false);
    if (res === "boss") return endRun(true);
    run.pending = res && res.next ? res.next : null;
    if (!run.pending && run.day >= 30) return endRun(true);
    saveStore(); expHUD();
  }
}

function bindLoot(){

  const rng = makeRng(hashStr("deals-" + today())), idx = [], pool = DEALS.map((_, i) => i);

    <h4>Today's deals</h4>
    <div class="camp-rows">${idx.map(i => { const d = DEALS[i], got = MT.deals.bought.includes(i); return `<div class="camp-row"><div>${d.t}<small>${got ? "Sold out for today" : "Once per day"}</small></div><button class="btn" data-deal="${i}" ${!got && canAfford(d.c) ? "" : "disabled"}>${got ? "Bought" : cText(d.c)}</button></div>`; }).join("")}</div>
    <h4>Harbor · trade 4 of your most plentiful resource for 1</h4>
    <div class="ex-res">${resRow(EX.res)}</div>
    <div class="row">${RES.map((r, i) => { const g = most(i); return `<button class="btn" data-trade="${i}" ${g >= 0 && EX.res[g] >= 4 ? "" : "disabled"} title="Pay 4 ${g >= 0 ? RES[g].n : ""}"><img class="ricon" src="${resIcon(i)}" alt=""> Get 1 ${r.n}</button>`; }).join("")}</div>`,
  bind(){
    bindLoot();
    $("freeChest").onclick = () => { EX.freeChest = today(); EX.loot = rollGear(0); saveStore(); rerender(); };
    $("buyChest").onclick = () => { if (EX.gold < 250 || EX.loot) return; EX.gold -= 250; EX.loot = rollGear(1); saveStore(); rerender(); };
    $("gemChest").onclick = () => { if (MT.gems < 200 || EX.loot) return; MT.gems -= 200; EX.loot = rollGear(2); saveStore(); rerender(); };
    $("buyEgg").onclick = () => { if (MT.gems < 150) return; MT.gems -= 150; MT.eggs++; toast("Egg bought. Hatch it in the Pets tab.", "good"); saveStore(); rerender(); };
    sheet.querySelectorAll("[data-deal]").forEach(bt => bt.onclick = () => {
      const i = +bt.dataset.deal, d = DEALS[i];
      if (MT.deals.bought.includes(i) || !pay(d.c)) return;

      startTrial({title:`Watchtower · Floor ${F}`, ch: 1 + Math.floor(F/6), day: 5 + (F % 6)*4,
        ev:{kind:"battle", tap:true, tier: F % 5 === 0 ? 2 : 1, etype: (F - 1) % 5},
        back:"trials", again:"Next floor", sel:"#climb",
        onWin(){ MT.tower.best = F; track("tower"); return grant(towerReward(F)); }});

      if (!best || !(MT.dun.tix[dn.id] > 0)) return;

    });

}
async function startTrial(t){
  if (inBattle) return;
  stopExpFlow(); close();
  TRIAL_SAVED = EX.run;
  EX.run = {trial:true, title:t.title, ch:t.ch, day:t.day, seed:(Math.random()*2**31)|0, trail:[[0,0]], hp:0, coins:0, sk:{}, wins:0, res:[0,0,0,0,0]};
  EX.run.hp = hs().maxHp;
  enterExp();
  const tok = ++expToken;
  const win = await tapBattle(t.ev, tok);
  EX.run = TRIAL_SAVED; TRIAL_SAVED = undefined;
  if (win === null){ saveStore(); return; }
  const got = win ? t.onWin() : "";
  saveStore();
  open(`
    <h2>${win ? "Victory" : "Pip retreats"}</h2>
    <span class="mode">${t.title}</span>
    <p class="tag">${win ? `Rewards: ${got}.` : "No ticket was used. Train, upgrade gear or hatch companions, then try again."}</p>
    <div class="row"><button class="btn primary" id="trAgain">${win ? t.again : "Try again"}</button><button class="btn" id="trBack">Back to Trials</button></div>`);
  $("trBack").onclick = () => openHub(t.back);
  $("trAgain").onclick = () => { openHub(t.back); const b = sheet.querySelector(t.sel); if (b && !b.disabled) b.click(); };
}

  const eyes = (y, r) => `<circle cx="18" cy="${y}" r="${r}" fill="#1d1a18"/><circle cx="30" cy="${y}" r="${r}" fill="#1d1a18"/>`;
  let g = "";
  if (id === "badger") g = `<circle cx="11" cy="15" r="5" fill="${f[0]}"/><circle cx="37" cy="15" r="5" fill="${f[0]}"/><circle cx="24" cy="27" r="16" fill="${f[0]}"/><rect x="20.5" y="11" width="7" height="26" rx="3.5" fill="${f[1]}"/>${eyes(26,2.2)}<ellipse cx="24" cy="36" rx="3.4" ry="2.4" fill="#1d1a18"/>`;
  else if (id === "otter") g = `<circle cx="12" cy="16" r="3.5" fill="${f[0]}"/><circle cx="36" cy="16" r="3.5" fill="${f[0]}"/><circle cx="24" cy="27" r="16" fill="${f[0]}"/><ellipse cx="24" cy="34" rx="9" ry="6.5" fill="${f[1]}"/>${eyes(24,2.2)}<ellipse cx="24" cy="31" rx="3" ry="2" fill="#1d1a18"/><path d="M15 34h-8M15 37h-7M33 34h8M33 37h7" stroke="${f[1]}" stroke-width="1"/>`;
  else if (id === "hog") g = `<path d="M6 30 9 17 14 22 16 9 21 17 24 6 27 17 32 9 34 22 39 17 42 30z" fill="${f[0]}"/><circle cx="24" cy="30" r="13" fill="${f[1]}"/>${eyes(28,2)}<circle cx="24" cy="35" r="2.6" fill="#1d1a18"/>`;
  else if (id === "owl") g = `<path d="M9 12 15 20 11 22zM39 12 33 20 37 22z" fill="${f[0]}"/><circle cx="24" cy="27" r="16" fill="${f[0]}"/><circle cx="17.5" cy="25" r="6.5" fill="${f[1]}"/><circle cx="30.5" cy="25" r="6.5" fill="${f[1]}"/><circle cx="17.5" cy="25" r="3" fill="#1d1a18"/><circle cx="30.5" cy="25" r="3" fill="#1d1a18"/><path d="M24 29 21 33h6z" fill="#e39a3a"/>`;
  else if (id === "fox") g = `<path d="M8 8 19 18 11 24zM40 8 29 18 37 24z" fill="${f[0]}"/><circle cx="24" cy="27" r="15" fill="${f[0]}"/><path d="M12 30 24 42 36 30 24 34z" fill="${f[1]}"/>${eyes(25,2.1)}<circle cx="24" cy="38" r="2.4" fill="#1d1a18"/>`;
  else if (id === "raccoon") g = `<circle cx="12" cy="14" r="5" fill="${f[0]}"/><circle cx="36" cy="14" r="5" fill="${f[0]}"/><circle cx="24" cy="27" r="16" fill="${f[0]}"/><path d="M9 22q15 -6 30 0v7q-15 -5 -30 0z" fill="#2d2d3a"/><ellipse cx="24" cy="35" rx="8" ry="6" fill="${f[1]}"/><circle cx="18" cy="25" r="2.2" fill="#f4f1e8"/><circle cx="30" cy="25" r="2.2" fill="#f4f1e8"/><ellipse cx="24" cy="33" rx="2.6" ry="2" fill="#1d1a18"/>`;
  else if (id === "lynx") g = `<path d="M9 6 18 19 10 23zM39 6 30 19 38 23z" fill="${f[0]}"/><path d="M9 6V1M39 6V1" stroke="#1d1a18" stroke-width="1.6"/><path d="M6 32 9 40 16 36zM42 32 39 40 32 36z" fill="${f[1]}"/><circle cx="24" cy="28" r="15" fill="${f[0]}"/><ellipse cx="24" cy="35" rx="7" ry="5" fill="${f[1]}"/><ellipse cx="18" cy="26" rx="2.2" ry="2.8" fill="#4f7d4e"/><ellipse cx="30" cy="26" rx="2.2" ry="2.8" fill="#4f7d4e"/><path d="M22 32h4l-2 2.4z" fill="#b5533f"/>`;
  else if (id === "heron") g = `<path d="M18 12q-6 -6 -12 -4" stroke="${f[0]}" stroke-width="2" fill="none"/><circle cx="20" cy="25" r="13" fill="${f[0]}"/><path d="M30 22 47 27 30 29z" fill="#e3b53a"/><circle cx="23" cy="22" r="2.2" fill="#1d1a18"/><path d="M12 36q8 6 16 0v10H12z" fill="${f[1]}"/>`;
  else if (id === "hare") g = `<ellipse cx="17" cy="11" rx="4.5" ry="11" fill="${f[0]}"/><ellipse cx="31" cy="11" rx="4.5" ry="11" fill="${f[0]}"/><ellipse cx="17" cy="11" rx="2" ry="8" fill="#f2a7b8"/><ellipse cx="31" cy="11" rx="2" ry="8" fill="#f2a7b8"/><circle cx="24" cy="30" r="14" fill="${f[0]}"/><path d="M27 19a5 5 0 1 0 0 8 4 4 0 1 1 0 -8z" fill="#f0c35a"/>${eyes(30,2)}<ellipse cx="24" cy="36" rx="2.4" ry="1.8" fill="#e9a0a8"/>`;
  else if (id === "stag") g = `<circle cx="24" cy="26" r="22" fill="#f0c35a" opacity=".22"/><path d="M15 18 9 6M9 6 5 8M11 10 6 13M33 18 39 6M39 6 43 8M37 10 42 13" stroke="#8a6440" stroke-width="2.4" stroke-linecap="round"/><ellipse cx="11" cy="21" rx="5" ry="3" fill="${f[0]}"/><ellipse cx="37" cy="21" rx="5" ry="3" fill="${f[0]}"/><path d="M14 20q10 -6 20 0l-3 18q-7 6 -14 0z" fill="${f[0]}"/><ellipse cx="24" cy="38" rx="6" ry="4.5" fill="${f[1]}"/>${eyes(26,2)}<ellipse cx="24" cy="37" rx="2.6" ry="1.8" fill="#1d1a18"/>`;
  else g = `<circle cx="24" cy="27" r="16" fill="${f[0]}"/>${eyes(23,1.4)}<ellipse cx="24" cy="33" rx="5" ry="4" fill="${f[1]}"/><path d="M13 40l-2 4M16 41l-1 4M35 40l2 4M32 41l1 4" stroke="${f[1]}" stroke-width="1.6" stroke-linecap="round"/>`;
  return `<svg class="petpic" viewBox="0 0 48 48" aria-hidden="true">${g}</svg>`;
}
function addPetXp(id, n){
  let l = pet(id); if (!l) return 0;
  let x = (MT.petx[id] || 0) + n, ups = 0;
  while (l < PET_MAX && x >= petNeed(l)){ x -= petNeed(l); l++; ups++; }
  if (l >= PET_MAX) x = 0;
  MT.pets[id] = l; MT.petx[id] = x;
  return ups;
}
function slotGain(s){
  const h = Math.min(YARD_CAP_H, (Date.now() - s.since)/3.6e6), ex = EXS.find(e => e.id === s.act);
  return {h, xp: Math.floor(h*60*ex.xp), res: s.act === "dig" ? Math.floor(h) : 0, gems: s.act === "forage" ? Math.floor(h*3) : 0};
}
function collectSlot(i){
  const s = MT.yard[i]; if (!s) return "";
  const g = slotGain(s), p = PETS.find(x => x.id === s.id);
  s.since = Date.now();
  const ups = addPetXp(s.id, g.xp), res = [0,0,0,0,0];
  for (let k=0;k<g.res;k++) res[Math.floor(Math.random()*5)]++;
  const got = grant({gems:g.gems, res});
  return `${p.n} +${g.xp} XP${ups ? ` (Lv ${pet(s.id)}!)` : ""}${got ? `, ${got}` : ""}`;
}
function hatchEgg(){
  if (MT.eggs < 1) return;
  MT.eggs--;
  const rr = rollPetRarity(), tier = PETS.filter(x => x.r === rr), p = tier[Math.floor(Math.random()*tier.length)], was = pet(p.id);
  if (rr >= 3) toast(`${PET_RAR[rr].n.toUpperCase()}! A 1-in-10,000 hatch!`, "gold");
  if (was >= PET_MAX){ MT.gems += 60; toast(`${p.n} is already max level · +60 Moonstones`, "good"); }
  else if (was){ MT.pets[p.id] = was + 1; toast(`Another ${p.n}! Lv ${was + 1}`, "good"); }
  else {
    MT.pets[p.id] = 1; MT.petx[p.id] = 0;
    const free = MT.yard.indexOf(null);
    if (free >= 0) MT.yard[free] = {id:p.id, act:"jog", since:Date.now()};
    toast(`${PET_RAR[rr].n} ${p.n} joined Pip!${free >= 0 ? " It's off to the exercise yard." : ""}`, "good");
  }
  saveStore(); rerender();
}
function renderPets(){
  const owned = PETS.filter(p => pet(p.id)), inYard = new Set(MT.yard.filter(Boolean).map(s => s.id));
  const bench = owned.filter(p => !inYard.has(p.id));
  const anyGain = MT.yard.some(s => s && slotGain(s).h >= .05);
  return {html:`
    <h2>Pets</h2>
    <p class="tag">Companions give Pip permanent bonuses. Up to 3 can exercise in the yard, and they keep training while you're away, up to ${YARD_CAP_H} hours at a time. Come back to collect their XP and finds.</p>
    <div class="card">
      <div class="camp-row" style="border:0;padding:0"><h3>Exercise yard</h3><button class="btn ${anyGain ? "primary" : ""}" id="collectAll" ${anyGain ? "" : "disabled"}>Collect all</button></div>
      <div class="yard">${MT.yard.map((s, i) => {
        if (!s) return `<div class="spot empty"><b>Empty spot</b>${bench.length ? `<div class="row">${bench.map(p => `<button class="btn" data-send="${p.id}">Send ${p.n}</button>`).join("")}</div>` : `<span>${owned.length ? "All your pets are busy." : "Hatch an egg to get your first pet."}</span>`}</div>`;
        const p = PETS.find(x => x.id === s.id), g = slotGain(s), full = g.h >= YARD_CAP_H;
        return `<div class="spot">
          <div class="spot-top">${petSVG(s.id).replace('class="petpic"', `class="petpic ${full ? "" : "moving"}"`)}<div><b>${p.n} · Lv ${pet(s.id)}</b><span>${full ? "Tired out. Collect to keep training." : `${{jog:"Jogging", dig:"Digging", forage:"Foraging"}[s.act]} for ${g.h.toFixed(1)} h`}</span></div></div>
          <div class="xpbar"><i style="width:${g.h/YARD_CAP_H*100}%"></i></div>
          <div class="exs">${EXS.map(e => `<button class="btn ${s.act === e.id ? "primary" : ""}" data-act="${i}:${e.id}" title="${e.d}">${e.n}</button>`).join("")}</div>
          <small class="tag">+${g.xp} XP${g.res ? ` · ${g.res} resources` : ""}${g.gems ? ` · ${g.gems} Moonstones` : ""} so far</small>
          <div class="row"><button class="btn" data-collect="${i}" ${g.h >= .05 ? "" : "disabled"}>Collect</button><button class="btn" data-rest="${i}">Bring home</button></div>
        </div>`; }).join("")}</div>
    </div>
    <div class="card">
      <div class="camp-row" style="border:0;padding:0"><div><h3>Eggs · ${MT.eggs}</h3><p>From the Market, events, quests and the Watchtower. A repeat pet gains a level.</p><div class="odds">${PET_RAR.map(r => `<span style="--rc:${r.c}">${r.n} ${r.odds}</span>`).join("")}</div></div><button class="btn ${MT.eggs ? "primary" : ""}" id="hatch" ${MT.eggs ? "" : "disabled"}>Hatch</button></div>
    </div>
    <h4>Your pets · treats cost ${TREATS.map(t => `${t.n}: 3 ${t.id === "berry" ? "Grain" : "Fish"} for ${t.xp} XP`).join(", ")}</h4>
    <div class="petlist">${PETS.slice().sort((a, b) => b.r - a.r).map(p => { const l = pet(p.id), rc = PET_RAR[p.r];
      if (!l) return `<div class="petcard off" style="--rc:${rc.c}">${petSVG(p.id)}<div><span class="prar">${rc.n} · ${rc.odds}</span><b>${p.n}</b><span>Not found yet · ${p.d(1)} at Lv 1</span></div></div>`;
      const need = petNeed(l), x = MT.petx[p.id] || 0, max = l >= PET_MAX;
      return `<div class="petcard" style="--rc:${rc.c}">${petSVG(p.id)}<div class="pc-body"><span class="prar">${rc.n}</span><b>${p.n} · Lv ${l}${max ? " (max)" : ""}</b><span>${p.d(l)}${max ? "" : ` → next level ${p.d(l+1)}`}</span>
        <div class="xpbar"><i style="width:${max ? 100 : x/need*100}%"></i></div><small class="tag">${max ? "Fully grown" : `${Math.floor(x)} / ${need} XP`}${inYard.has(p.id) ? " · in the yard" : ""}</small>
        <div class="row">${TREATS.map(t => `<button class="btn" data-feed="${p.id}:${t.id}" ${!max && canPay(t.cost) ? "" : "disabled"}>${t.n}</button>`).join("")}</div></div></div>`; }).join("")}</div>`,
  bind(){
    $("hatch").onclick = hatchEgg;
    $("collectAll").onclick = () => { const out = MT.yard.map((s, i) => s && slotGain(s).h >= .05 ? collectSlot(i) : "").filter(Boolean); if (out.length) toast(out.join(" · "), "good"); rerender(); };
    sheet.querySelectorAll("[data-collect]").forEach(b => b.onclick = () => { toast(collectSlot(+b.dataset.collect), "good"); rerender(); });
    sheet.querySelectorAll("[data-rest]").forEach(b => b.onclick = () => { const i = +b.dataset.rest; const t = collectSlot(i); MT.yard[i] = null; saveStore(); if (t) toast(t, "good"); rerender(); });
    sheet.querySelectorAll("[data-send]").forEach(b => b.onclick = () => { const i = MT.yard.indexOf(null); if (i < 0) return; MT.yard[i] = {id:b.dataset.send, act:"jog", since:Date.now()}; saveStore(); rerender(); });
    sheet.querySelectorAll("[data-act]").forEach(b => b.onclick = () => { const [i, a] = b.dataset.act.split(":"), s = MT.yard[+i]; if (!s || s.act === a) return; const t = collectSlot(+i); s.act = a; saveStore(); if (t && !t.includes("+0 XP")) toast(t, "good"); rerender(); });
    sheet.querySelectorAll("[data-feed]").forEach(b => b.onclick = () => {
      const [id, tid] = b.dataset.feed.split(":"), t = TREATS.find(x => x.id === tid);
      if (!canPay(t.cost) || pet(id) >= PET_MAX) return;
      t.cost.forEach((n, i) => EX.res[i] -= n);
      const ups = addPetXp(id, t.xp); saveStore();
      toast(`${PETS.find(x => x.id === id).n} loved the ${t.n.toLowerCase()} · +${t.xp} XP${ups ? ` · Lv ${pet(id)}!` : ""}`, "good"); rerender();
    });
  }};
}

function showCamp(){ openHub("adventure"); }

$("exCamp").onclick = () => { if (!inBattle){ saveStore(); showCamp(); } };
$("exSpeed").onclick = () => { EX.speed = spd() === 1 ? 2 : spd() === 2 ? 3 : 1; saveStore(); expHUD(); };

/* ---------- boot: show a sample map behind the menu ---------- */
resize();
const saved = DB.saves.daily && DB.saves.daily.date === today() ? DB.saves.daily : DB.saves.endless || null;
if (saved){ S = saved; }
else { newGame("daily"); }
rebuildCand(); centerView(); updateHUD();
showHome();
};
</script>

<div class="overlay" id="slots"><div class="sheet">
  <h1 class="logo">Meadow<span>mark</span></h1>
  <p class="tag">Choose a save slot. Each slot keeps its own maps, levels, records and expedition.</p>
  <div id="slotList" class="modes"></div>
</div></div>

<script>
(() => {
  const TITLES = ["Wanderer","Settler","Shepherd","Homesteader","Miller","Reeve","Steward","Surveyor","Cartographer","Warden","Landgrave","Marquess of Meadows","Keeper of the Long Map"];
  const keyOf = n => n === 1 ? "meadowmark.v1" : "meadowmark.v1.slot" + n;
  const read = n => { try { const s = localStorage.getItem(keyOf(n)); return s ? JSON.parse(s) : null; } catch(e){ return null; } };
  const lvl = xp => { let n = 1; while (xp >= 300*(n+1)*n) n++; return n; };
  const f = n => (n || 0).toLocaleString("en-US");
  const armed = {};
  function render(){
    const list = document.getElementById("slotList"); list.innerHTML = "";
    for (let n = 1; n <= 3; n++){
      const d = read(n), st = d && d.stats, ex = d && d.exp;
      const wrap = document.createElement("div"); wrap.className = "slotwrap";
      const b = document.createElement("button");
      b.className = "slot" + (d ? "" : " empty");
      if (d && st){
        const L = lvl(st.xp || 0), when = d.lastPlayed ? new Date(d.lastPlayed).toLocaleDateString("en-US", {month:"short", day:"numeric", year:"numeric"}) : "";
        b.innerHTML = `<span class="sn">${n}</span><span class="st">Level ${L} · ${TITLES[Math.min(L-1, TITLES.length-1)]}</span>
          <span class="ss">${f(st.games)} maps · best ${f(st.bestGame)} · ${st.streak || 0}-day streak<br>Expedition chapter ${ex ? ex.maxCh : 1} · ${f(ex ? ex.gold : 0)} gold${when ? " · played " + when : ""}</span>
          <span class="sg">Continue</span>`;
      } else {
        b.innerHTML = `<span class="sn">${n}</span><span class="st">Empty slot</span><span class="ss">Start a new meadow from scratch</span><span class="sg">New game</span>`;
      }
      b.onclick = () => { document.getElementById("slots").hidden = true; window.startMeadowmark(n); };
      wrap.appendChild(b);
      if (d){
        const del = document.createElement("button");
        del.className = "slotdel" + (armed[n] ? " arm" : "");
        del.textContent = armed[n] ? `Tap again to erase slot ${n} for good` : "Erase this slot";
        del.onclick = () => {
          if (armed[n]){ try { localStorage.removeItem(keyOf(n)); } catch(e){} armed[n] = false; }
          else { armed[n] = true; setTimeout(() => { armed[n] = false; render(); }, 3500); }
          render();
        };
        wrap.appendChild(del);
      }
      list.appendChild(wrap);
    }
  }
  render();
})();
</script>
